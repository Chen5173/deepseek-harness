# dsh-oh-my-dsh-config 的 bundle patch 层（profile 组合顺序：base → web-app → 各插件 bundle → profile cordis.yml → profile cordis.patch.yml → 家目录层 → --patch）。
#
# 本层做两件事，都不改内核源码：
#   1) 把「会话标题提供器」的选择与参数从 packages/bundle/base/cordis.patch.yml 搬到插件层；
#   2) 插入本插件自身（宿主半边：浏览器标签页品牌注入）。
#
# 语义依据（vendor/loader + @deepseek-ai/cordis-plugin-include 的 applyEntryPatches）：
#   - 补丁按 id 命中已有行；config 是整行替换，不是字段合并，所以下面必须写完整 config。
#   - 补丁里写 name 且与目标行现有 name 不同时，整条补丁被 warn 跳过。
#     因此换提供器实现包不能用「改 session-title-llm 的 name」，只能：停用原行 + 插入新行。
#   - 未命中的 id 只 warn 不报错，所以本层在官方 base（first-prompt）与本 fork base（all-prompts）下都成立。

# 1) 停用 base 层的标题提供器行（无论它当前指向哪个实现包）。
- id: session-title-llm
  disabled: true

# 2) 换成「整段会话总结」提供器，并按个人偏好放宽预算。
#    注意 reasoningEffort: off 的解析结果：js-yaml 4 走 YAML 1.2 核心方案，`off` 保持为字符串
#    "off"（已实测），正好匹配 session-title-llm 的 z.string() schema；写成 true/false 才会出错。
- insert:
    - id: session-title-all-prompts
      name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
      config:
        targetWords: 12
        targetCjkCharacters: 24
        maxInputBytes: 32768
        maxOutputTokens: 128
        timeoutMs: 60000
        # 标题不需要深度推理：把辅助调用钉在最小 effort，
        # 否则推理型模型会把 maxOutputTokens 全花在思考上而吐不出标题。
        reasoningEffort: off
        includeAssistantReplies: true

# 3) 本插件的宿主半边。
- insert:
    - id: dsh-oh-my-dsh-config
      name: dsh-oh-my-dsh-config
      config:
        # fork 品牌名；留空则用默认值 Oh-My-Dsh。
        brand: Oh-My-Dsh
        # fork 基线标记文件（相对 repoRoot）。文件不存在时本插件整体不注入，
        # 所以在官方/非 fork 检出上装错也不会污染页面。
        baseFile: my-custom/oh-my-dsh-base.txt
        # 版本号自增上限的刷新间隔（毫秒）；0 表示只在首次渲染时计算一次。
        refreshMs: 60000
